name: "Copilot Setup Steps"

# Smoke test: proves GitHub dispatches jobs to our self-hosted ARC fleet.
# Runs on ARC (not GitHub-hosted) whenever this file changes or manually.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or Copilot will ignore it.
  copilot-setup-steps:
    # ARC runner scale sets on se1/nl1. Must match the Helm installation
    # name used with the gha-runner-scale-set chart.
    runs-on: arc-runner-set

    permissions:
      contents: read

    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prove we run on ARC
        run: |
          echo "hostname=$(hostname)"
          echo "os=$(uname -a)"
          echo "runner=${RUNNER_NAME:-unknown}"
