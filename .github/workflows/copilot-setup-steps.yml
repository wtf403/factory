name: "Copilot Setup Steps"

# Smoke test: proves GitHub dispatches jobs to our self-hosted ARC fleet.
# Runs on ARC (not GitHub-hosted) whenever this file changes or manually.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or Copilot will ignore it.
  copilot-setup-steps:
    # ARC runner scale set on us1. Must match the Helm installation
    # name used with the gha-runner-scale-set chart.
    runs-on: arc-runner-set

    permissions:
      contents: read

    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prove we run on ARC
        run: |
          echo "hostname=$(hostname)"
          echo "os=$(uname -a)"
          echo "runner=${RUNNER_NAME:-unknown}"

      # BYOK provider override: expose Actions secrets as COPILOT_* env vars
      # so every later step in this job (including the Copilot agent harness)
      # inherits them. Values stay masked in logs. Add the secrets under
      # repo Settings -> Secrets and variables -> Actions when ready:
      #   COPILOT_PROVIDER_TYPE, COPILOT_PROVIDER_BASE_URL,
      #   COPILOT_MODEL, COPILOT_PROVIDER_API_KEY
      - name: Export BYOK provider config
        run: |
          for v in COPILOT_PROVIDER_TYPE COPILOT_PROVIDER_BASE_URL COPILOT_MODEL COPILOT_PROVIDER_API_KEY; do
            echo "${v}=${!v}" >> "$GITHUB_ENV"
          done
        env:
          COPILOT_PROVIDER_TYPE: ${{ secrets.COPILOT_PROVIDER_TYPE }}
          COPILOT_PROVIDER_BASE_URL: ${{ secrets.COPILOT_PROVIDER_BASE_URL }}
          COPILOT_MODEL: ${{ secrets.COPILOT_MODEL }}
          COPILOT_PROVIDER_API_KEY: ${{ secrets.COPILOT_PROVIDER_API_KEY }}
